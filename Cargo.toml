[package]
name = "kt-signal-connector"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
description = "Local, isolated Signal connector for KT Desktop"
repository = "https://github.com/KTAIorg/kt-signal-connector"
publish = false

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = "2"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
hmac = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
    # Contract revision 1.163 (§4.161): the platform trust store, not the
    # compiled-in webpki set — on macOS rustls-native-certs reads the
    # Security.framework keychains (user-installed CAs included), so the CDN
    # attachment-download client validates exactly the TLS reality the
    # official desktop (Chromium + system store) accepts. The doctor's strict
    # probe stays pinned to the vendored root independently (src/doctor.rs).
    "rustls-tls-native-roots",
    "socks",
    "stream",
] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
unicode-segmentation = "1.13.3"
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
# kill(pid, 0) liveness probe for the runtime.doctor lock face (§4.79);
# signal 0 is not representable in rustix's typed Signal.
libc = "0.2"
rustix = { version = "1", features = ["process", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Constructing a `reqwest::Response` from an `http::Response` lets the doctor
# unit suite pin the service-probe `http` classification without any network.
http = "1"
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
